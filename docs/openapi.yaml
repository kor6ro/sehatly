components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: 'Sanctum personal access token'
      description: 'Send `Authorization: Bearer <token>`. The token is issued by `POST /api/v1/auth/otp/verify` and refreshed by `POST /api/v1/auth/refresh`. Every operation below declares its own `security`, so an empty `security: []` means the route is intentionally anonymous.'
  schemas:
    SuccessEnvelope:
      type: object
      description: '`{"success":true,"data":<data>,"message":<message>}`. Exactly these three keys: there is NO `meta` key, because omission is what makes "this response is not paginated" unambiguous. Key order is `success`, `data`, `message` and is load-bearing.'
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          description: "The endpoint's payload. See the operation's notes."
        message:
          type: string
      required:
        - success
        - data
        - message
      additionalProperties: false
    PaginatedEnvelope:
      type: object
      description: '`{"success":true,"data":<list>,"message":<message>,"meta":<meta>}`. `meta` is a TOP-LEVEL FOURTH KEY, a sibling of `data` -- not nested inside it. That position is fixed by `App\Support\ApiResponse`, which appends `meta` after `message` so adding pagination cannot renumber the three keys every existing client already reads.'
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          description: 'The page, keyed by the RESOURCE NAME -- `{"dokter":[...]}` and `{"provinsi":[...]}` rather than a bare list, because the key is what tells a client which resource it is reading. Every list controller wraps its collection in exactly one such key, so the object is the shape the application actually answers.'
          additionalProperties: true
        message:
          type: string
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      required:
        - success
        - data
        - message
        - meta
      additionalProperties: false
    PaginatedMeta:
      type: object
      description: 'The project-wide pagination block, derived from the paginator so no controller can spell it differently. `per_page` is the page size ACTUALLY applied after the 100 cap, so it is correct where the caller asked for more. `from` and `to` are `null` on an empty page -- "no rows" has no first and last row. A deliberately unpaginated list carries the same keys with `current_page` and `last_page` both 1. The four review keys below are OPTIONAL and appear only on the doctor review list; they are declared here rather than in a separate component because the generator selects the envelope from the controller''s `pageMeta()` call and that endpoint answers the same pagination block with the aggregate merged in.'
      properties:
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        from:
          type: [integer, 'null']
          minimum: 1
        to:
          type: [integer, 'null']
          minimum: 1
        distribusi:
          type: object
          description: "Review counts per star value, read from the recomputed aggregate. Always all five keys, zero when a star has no review. Not narrowed by `?rating=`: the distribution is the doctor's whole review history."
          properties: { 1: { type: integer, minimum: 0 }, 2: { type: integer, minimum: 0 }, 3: { type: integer, minimum: 0 }, 4: { type: integer, minimum: 0 }, 5: { type: integer, minimum: 0 } }
          additionalProperties: false
        rata_rata:
          type: [number, 'null']
          description: 'Recomputed `AVG(rating)`, or `null` when there are no reviews. Never `0.0` -- zero is a rating, and an unrated doctor must not read as rated zero. The UI hides the summary below five reviews; the API stays honest.'
        rata_rata_komunikasi:
          type: [number, 'null']
          description: 'Recomputed `AVG(rating_komunikasi)` over the reviews that scored it, or `null` when none did. A `NULL` sub-rating (`telemedicine_test.sql:1056`) is "not scored", not a zero.'
        rata_rata_akurasi:
          type: [number, 'null']
          description: 'Recomputed `AVG(rating_akurasi)` over the reviews that scored it, or `null` when none did.'
      required:
        - current_page
        - last_page
        - per_page
        - total
        - from
        - to
      additionalProperties: false
    ErrorEnvelope:
      type: object
      description: '`{"success":false,"message":<message>,"errors":<errors>}`. Used for 401, 403, 404, 429 and 500, all of which pass an empty map. `message` is a fixed string per status, never the underlying exception text. `meta` is present on a 429 (`retry_after`, plus `sisa_percobaan` on OTP verify) and absent everywhere else, so a client must null-check it rather than assume it.'
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          description: 'A field-keyed map of messages. `ApiResponse::error()` casts it to an object so an empty set encodes as `{}` rather than `[]`. Keys are the dotted attribute path as submitted, which is exactly what `ValidationException::errors()` produces.'
          additionalProperties: { type: array, items: { type: string }, minItems: 1, description: 'Every message produced for this field. A field that fails more than one rule carries more than one entry; nothing is flattened into a single string.' }
        meta:
          type: object
          description: 'Limiter-specific numbers, present only on the responses named in the schema descriptions above. `retry_after` mirrors the `Retry-After` header in seconds; `sisa_percobaan` is how many OTP guesses remain before the code is burned.'
          properties: { retry_after: { type: integer, minimum: 0 }, sisa_percobaan: { type: integer, minimum: 0 } }
          additionalProperties: true
      required:
        - success
        - message
        - errors
      additionalProperties: false
    ValidationErrorEnvelope:
      type: object
      description: 'The 422 envelope. Identical in shape to `ErrorEnvelope` and deliberately declared as its own component rather than reused, because the thing that makes a 422 hard to consume is `errors` carrying MORE THAN ONE MESSAGE PER FIELD, and a client that treats it as `{field: string}` silently drops every message after the first. `message` is the fixed string "The given data was invalid." -- never `ValidationException::summarize()`, which promotes the first field error and appends "(and N more errors)" and would make `message` data-dependent. `meta` is present only on `POST /auth/otp/verify`, carrying `sisa_percobaan`.'
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          description: 'A field-keyed map of messages. `ApiResponse::error()` casts it to an object so an empty set encodes as `{}` rather than `[]`. Keys are the dotted attribute path as submitted, which is exactly what `ValidationException::errors()` produces.'
          additionalProperties: { type: array, items: { type: string }, minItems: 1, description: 'Every message produced for this field. A field that fails more than one rule carries more than one entry; nothing is flattened into a single string.' }
        meta:
          type: object
          description: 'Limiter-specific numbers, present only on the responses named in the schema descriptions above. `retry_after` mirrors the `Retry-After` header in seconds; `sisa_percobaan` is how many OTP guesses remain before the code is burned.'
          properties: { retry_after: { type: integer, minimum: 0 }, sisa_percobaan: { type: integer, minimum: 0 } }
          additionalProperties: true
      required:
        - success
        - message
        - errors
      additionalProperties: false
