; Render's free instance has 512 MB. Keep PHP below that and leave room for
; Apache children.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60

; The image is immutable; a deploy replaces the whole container.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

expose_php = Off
