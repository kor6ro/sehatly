# Render terminates TLS and forwards plain HTTP to this container. The port is
# substituted by deploy/entrypoint.sh because Render assigns it through PORT.
<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Uploads are capped here as well as in php.ini: Apache refuses the body
    # before PHP has to buffer it.
    LimitRequestBody 25165824

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
